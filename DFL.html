<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت من</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: #000000;
            color: white;
            height: 100vh;
            overflow-x: hidden;
        }

        /* استایل دکمه منو (همبرگری) */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            z-index: 1001; /* همیشه بالای همه چیز باشد */
            background: transparent;
            border: none;
        }

        /* استایل منوی کشویی */
        .side-menu {
            position: fixed;
            top: 0;
            right: -50%; /* در حالت بسته، ۵۰ درصد خارج از صفحه است */
            width: 50%; /* دقیقاً نصف صفحه */
            height: 100%;
            background-color: #111111; /* مشکی کمی روشن‌تر برای تفکیک از پس‌زمینه */
            transition: right 0.4s ease; /* انیمیشن نرم */
            z-index: 1000;
            padding: 80px 20px 20px 20px;
            border-left: 1px solid #333;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        /* وقتی کلاس active اضافه شود، منو به داخل صفحه می‌آید */
        .side-menu.active {
            right: 0;
        }

        /* استایل لینک‌های داخل منو */
        .side-menu ul {
            list-style: none;
        }

        .side-menu ul li {
            margin-bottom: 25px;
        }

        .side-menu ul li a {
            color: #cccccc;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s;
        }

        .side-menu ul li a:hover {
            color: #ffffff; /* سفید می‌شود وقتی موس روی آن می‌رود */
        }

        /* استایل محتوای اصلی صفحه */
        .main-content {
            padding: 80px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- دکمه منو -->
    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <!-- منوی کشویی -->
    <div class="side-menu" id="mySideMenu">
        <ul>
            <li><a href="#">صفحه اصلی</a></li>
            <li><a href="#">درباره ما</a></li>
            <li><a href="#">خدمات</a></li>
            <li><a href="#">تماس با ما</a></li>
        </ul>
    </div>

    <!-- محتوای اصلی سایت که بعدا اضافه می‌کنیم -->
    <div class="main-content">
        <!-- فعلا خالی است -->
    </div>

    <!-- اسکریپت برای باز و بسته کردن منو -->
    <script>
        function toggleMenu() {
            var menu = document.getElementById("mySideMenu");
            menu.classList.toggle("active");
        }
    </script>

</body>
</html>
